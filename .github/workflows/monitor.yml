name: Monitor GlobalEduca

on:
  schedule:
    - cron: '*/10 * * * *'   # cada 10 minutos (GitHub puede retrasarlo unos minutos)
  workflow_dispatch:          # botón "Verificar ahora" y ejecución manual desde Actions

permissions:
  contents: write

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias
        run: npm install --no-audit --no-fund

      - name: Caché del navegador
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-1.47.2

      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium

      - name: Comprobar módulos
        env:
          GE_USER: ${{ vars.GE_USER }}
          GE_PASSWORD: ${{ secrets.GE_PASSWORD }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          TRIGGER: ${{ github.event_name }}
        run: node monitor/check.js

      - name: Guardar resultados
        run: |
          git config user.name "monitor-globaleduca"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs/data docs/screenshots
          git diff --cached --quiet && exit 0
          git commit -m "Estado $(TZ=Europe/Madrid date +'%d/%m %H:%M')"
          for i in 1 2 3; do
            git pull --rebase -X theirs && git push && exit 0
            sleep 5
          done
          exit 1

